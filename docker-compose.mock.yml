services:
  zoneboard:
    build: .
    ports:
      - "${ZONEBOARD_PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      API_BASE_URL: http://mock-cloudflare:3999/client/v4
      FORCE_HTTPS: "0"
    depends_on:
      - mock-cloudflare
    restart: unless-stopped

  mock-cloudflare:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./scripts/mock-cloudflare.mjs:/app/mock-cloudflare.mjs:ro
    command: ["node", "mock-cloudflare.mjs"]
    expose:
      - "3999"
